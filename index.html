
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, sans-serif; background: #050816; }
.banner {
    position: relative;
    min-height: 300px;
    padding: 45px 15px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    border: 2px solid #2876a5;
    border-radius: 18px;
    background:
        radial-gradient(circle at 15% 20%, #153d70, transparent 40%),
        radial-gradient(circle at 85% 80%, #154e66, transparent 40%),
        linear-gradient(135deg, #050816, #10152d, #080b1b);
}
.banner::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
        linear-gradient(#00e5ff12 1px, transparent 1px),
        linear-gradient(90deg, #00e5ff12 1px, transparent 1px);
    background-size: 35px 35px;
}
.content { position: relative; z-index: 1; }
.small { color: #a8eaff; letter-spacing: 6px; font-size: 14px; margin-bottom: 22px; }
h1 {
    margin: 0;
    font-size: clamp(38px, 7vw, 72px);
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 3px;
    background: linear-gradient(90deg,#00f5ff,#fff,#38bdf8,#a855f7,#00f5ff);
    background-size: 300% auto;
    color: transparent;
    background-clip: text;
    -webkit-background-clip: text;
    animation: flow 5s linear infinite;
    filter: drop-shadow(0 0 12px #00e5ff50);
}
.tag {
    display: inline-block;
    margin-top: 25px;
    padding: 10px 22px;
    border: 1px solid #00e5ff99;
    border-radius: 30px;
    color: #d8faff;
    letter-spacing: 4px;
    font-size: 13px;
}
.spark { position: absolute; color: #00f5ff; font-size: 25px; animation: blink 2s infinite alternate; }
.s1 { top: 20%; left: 10%; }
.s2 { top: 25%; right: 12%; color: #a855f7; }
.s3 { bottom: 18%; left: 18%; color: #38bdf8; }
.s4 { bottom: 20%; right: 18%; }
@keyframes flow { to { background-position: 300% center; } }
@keyframes blink {
    from { opacity: .3; transform: scale(.8); }
    to { opacity: 1; transform: scale(1.2); }
}
@media(max-width:500px) {
    .small { letter-spacing: 3px; }
    h1 { letter-spacing: 1px; }
    .tag { letter-spacing: 2px; }
}
</style>
</head>
<body>
<div class="banner">
    <span class="spark s1">✦</span>
    <span class="spark s2">✧</span>
    <span class="spark s3">✧</span>
    <span class="spark s4">✦</span>
    <div class="content">
        <div class="small">READY TO TEST YOUR KNOWLEDGE?</div>
        <h1>QUIZ</h1>
        <div class="tag">THINK • ANSWER • WIN</div>
    </div>
</div>
</body>
</html>
